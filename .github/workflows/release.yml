name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Releases queue rather than race: cancelling one mid-push would leave the
# registry holding whichever tag happened to finish, which is not necessarily
# the newest commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same workflow pull requests run. Before this, release ran only `go vet`
  # and a build, so a red test suite still published an image.
  verify:
    uses: ./.github/workflows/pipeline.yml

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1

      - id: meta
        timeout-minutes: 1
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          TAG="$(date -u +'%Y.%m.%d-%H%M%S')-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${OWNER}/httphq"
          {
            echo "tag=${TAG}"
            echo "image=${IMAGE}:${TAG}"
            echo "image_latest=${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 2

      - uses: docker/build-push-action@v7
        timeout-minutes: 10
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
