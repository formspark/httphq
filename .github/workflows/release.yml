name: release

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Releases queue rather than race: cancelling one mid-push would leave the
# registry holding whichever tag happened to finish, which is not necessarily
# the newest commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same workflow pull requests run, so a red suite cannot publish an image.
  verify:
    uses: ./.github/workflows/pipeline.yml

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1

      - id: meta
        timeout-minutes: 1
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          TAG="$(date -u +'%Y.%m.%d-%H%M%S')-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${OWNER}/httphq"
          {
            echo "tag=${TAG}"
            echo "image=${IMAGE}:${TAG}"
            echo "image_latest=${IMAGE}:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 2

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 10
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Reads the cache `pipeline.yml` writes on every pull request. A cache
          # that nothing reads costs the write and buys nothing.
          cache-from: type=gha
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
