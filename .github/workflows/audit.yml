# `check:audit` runs inside `pnpm verify`, so CI answers "does this change
# introduce an advisory" on every pull request. It cannot answer "did an
# advisory land in something already merged", because a repository nobody
# pushes to runs nothing. This asks that second question once a week.
#
# The dependency job needs no install step: `pnpm audit` reads `pnpm-lock.yaml`
# and queries the registry, so it is a checkout and one command.
#
# The image job is here for the same reason and asks the same question of the
# base image. The pipeline scans what a pull request builds, which catches a
# change that introduces a vulnerable base. It cannot catch a base image tag
# that stops receiving patches while nothing here changes, because nothing
# runs, so an image can carry fixable high and critical advisories for weeks.
name: audit

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 2

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
        timeout-minutes: 3

      - name: Check dependencies for known vulnerabilities
        run: pnpm run check:audit
        timeout-minutes: 3

  image:
    name: Audit the runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 2

      # Built rather than pulled. The published image is whatever was last
      # released; the question worth asking weekly is what the Dockerfile
      # produces today, against the base image as it stands today.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        timeout-minutes: 10
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: httphq:audit

      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        timeout-minutes: 5
        with:
          image-ref: httphq:audit
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os
          exit-code: "1"
