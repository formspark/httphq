# `check:audit` runs inside `pnpm verify`, so CI answers "does this change
# introduce an advisory" on every pull request. It cannot answer "did an
# advisory land in something already merged", because a repository nobody
# pushes to runs nothing. This asks that second question once a week.
#
# There is no install step. `pnpm audit` reads `pnpm-lock.yaml` and queries the
# registry, so the whole job is a checkout and one command.
name: audit

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        timeout-minutes: 2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        timeout-minutes: 2

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
        timeout-minutes: 3

      - name: Check dependencies for known vulnerabilities
        run: pnpm run check:audit
        timeout-minutes: 3
