name: test

on:
  # The nightly run exists because the page scripts pull Alpine and highlight.js
  # from public CDNs at runtime, so the suite can start failing on a day nobody
  # pushed anything.
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - develop
      - master

# A superseded pull request run tells you about a commit that is no longer the
# branch tip, so cancel it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Not in pipeline.yml: release.yml calls that too, and a push to master has no
  # merge base to diff against.
  em-dashes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          fetch-depth: 0
      - run: bash scripts/check-em-dashes.sh "origin/${{ github.base_ref }}"
        timeout-minutes: 1

  verify:
    uses: ./.github/workflows/pipeline.yml
