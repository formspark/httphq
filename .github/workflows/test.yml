name: test

on:
  # The nightly run exists because the page scripts pull Alpine and highlight.js
  # from public CDNs at runtime, so the suite can start failing on a day nobody
  # pushed anything.
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - develop
      - master

# A superseded pull request run tells you about a commit that is no longer the
# branch tip, so cancel it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/pipeline.yml
