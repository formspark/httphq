# The single definition of what "verified" means. test.yml and release.yml both
# call this workflow, so a check cannot exist on pull requests yet be skipped on
# the push that publishes the image.
#
# Every check is a package.json script, and `pnpm verify` runs the same scripts
# in the same order, so a tree that passes locally passes here. The Go jobs set
# up pnpm only to read those scripts; they install no Node dependencies.
name: pipeline

on:
  workflow_call:

# Declaring the block turns every other scope off. The publish job in release.yml
# widens it for itself; nothing here needs more than the source.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
      - uses: actions/setup-go@v7
        timeout-minutes: 2
        with:
          go-version-file: "go.mod"
      # Before setup-node, which needs pnpm on PATH. The version comes from
      # packageManager in package.json.
      - uses: pnpm/action-setup@v6
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".tool-versions"
      # Reachability, not presence: govulncheck reports an advisory only when a
      # path from this code actually reaches the vulnerable symbol, so it does
      # not fail on a dependency that merely sits in go.sum. That makes it
      # strict enough to gate on.
      #
      # Every Go tool here is pinned in its script, so a later release cannot
      # change the verdict on a tree that did not change. Each is scoped to
      # ./src, because node_modules ships a stray Go package that ./... would
      # otherwise build.
      - name: Check for known vulnerabilities
        timeout-minutes: 5
        run: pnpm run go:vuln
      - name: Check formatting
        timeout-minutes: 1
        run: pnpm run go:format:check
      # golangci-lint runs go vet as one of its linters, alongside the checks vet
      # does not cover: unchecked error returns, dead assignments, unused code,
      # staticcheck's correctness rules.
      - name: Lint
        timeout-minutes: 5
        run: pnpm run go:lint
      # golangci-lint's `unused` works a package at a time, so it cannot see an
      # exported function that no entry point reaches. This can.
      - name: Check for unreachable Go code
        timeout-minutes: 3
        run: pnpm run go:deadcode
      # The Go counterpart to the `complexity` rule the page scripts are linted
      # with.
      - name: Check complexity
        timeout-minutes: 2
        run: pnpm run go:cyclo
      # Coverage is measured and reported, not gated. A threshold set before the
      # number is known is a guess; this prints it so a later one can be set at
      # what the suite actually reaches.
      - name: Test with coverage
        timeout-minutes: 5
        run: pnpm run test:coverage
      - name: Report coverage
        timeout-minutes: 1
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage against its floor
        timeout-minutes: 1
        run: pnpm run go:coverage:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
      - uses: pnpm/action-setup@v6
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
      # One install covers both workspace projects, so the Playwright suite's
      # own dependencies are resolvable for the type-aware lint below.
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 2
      - run: pnpm run lint
        timeout-minutes: 2
      - name: Check formatting
        timeout-minutes: 2
        run: pnpm run format:check
      # The pre-commit hook only formats what its globs match, so a gap there is
      # silent: CI lints the file, the hook never touched it.
      - name: Check lint-staged globs
        timeout-minutes: 1
        run: pnpm run check:lint-staged
      # In verify since the beginning and never here, so a commit made with
      # --no-verify landed an unsorted manifest and nothing said so.
      - name: Check package.json is sorted
        timeout-minutes: 1
        run: pnpm run check:package-json
      - name: Check prose for em dashes
        timeout-minutes: 1
        run: pnpm run check:prose
      # setup-uv publishes no floating major tag, so the release is pinned.
      - uses: astral-sh/setup-uv@v10.2.0
        timeout-minutes: 2
      - name: Check spelling
        timeout-minutes: 2
        run: pnpm run check:typos
      # Unused files, exports and dependencies in the JavaScript periphery. The
      # Go application is covered by go:deadcode and golangci-lint instead.
      - name: Check for dead code
        timeout-minutes: 2
        run: pnpm run check:dead-code
      - name: Check dependencies for known vulnerabilities
        timeout-minutes: 2
        run: pnpm run check:audit
      - name: Type-check the page scripts and the Playwright suite
        timeout-minutes: 2
        run: pnpm run typecheck

  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
      - uses: pnpm/action-setup@v6
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        timeout-minutes: 2
      # public/app.css is committed so the binary and container need no Node.
      # A rebuild that changes it means a template or script gained a class the
      # committed sheet does not carry, and the running app would be missing it.
      - name: Rebuild stylesheet and check it matches the committed one
        timeout-minutes: 2
        run: pnpm run css:check

  # The production build, with the flags the image uses.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
      - uses: actions/setup-go@v7
        timeout-minutes: 2
        with:
          go-version-file: "go.mod"
      - uses: pnpm/action-setup@v6
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".tool-versions"
      - run: pnpm run build
        timeout-minutes: 3

  # The binary above is built from the checkout; the image is built from the
  # subset of it the Dockerfile copies. Only this catches a build input the
  # Dockerfile does not know about. Nothing is pushed here: the registry is
  # release.yml's business.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
      - uses: docker/setup-buildx-action@v4
        timeout-minutes: 2
      - uses: docker/build-push-action@v7
        timeout-minutes: 10
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Loaded into the local daemon so the scan below has something to
          # read. Without it the build stays in buildx's cache and there is no
          # image to point at.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: httphq:scan

      # The image half of `check:audit`. A base image pinned to a branch that
      # has stopped receiving patches keeps building, and nothing says so: one
      # repository in this fleet was publishing 38 fixable high and critical
      # advisories that no change in it could have fixed.
      #
      # `os` packages only, because the application's own dependencies are
      # already gated by `check:audit`, and scanning everything reports the npm
      # that ships inside a base image, which is neither reachable at runtime
      # nor fixable here. `ignore-unfixed` is the same scoping `check:audit`
      # uses: an advisory with no released fix is not something a build can act
      # on, and failing on one teaches everyone to skip the step.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 5
        with:
          image-ref: httphq:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os
          exit-code: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 1
      - uses: actions/setup-go@v7
        timeout-minutes: 2
        with:
          go-version-file: "go.mod"
      - uses: pnpm/action-setup@v6
        timeout-minutes: 2
      - uses: actions/setup-node@v7
        timeout-minutes: 2
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
      # The suite starts ./bin/httphq itself; see webServer in
      # e2e/playwright.config.ts.
      - name: Build server
        timeout-minutes: 3
        run: pnpm run build
      # The workspace root is where the lockfile lives, so the install runs
      # there and links the suite's dependencies as part of it.
      - name: Install dependencies
        timeout-minutes: 2
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm --filter httphq-e2e exec playwright install --with-deps chromium
      - name: Run Playwright tests
        timeout-minutes: 5
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
