<!doctype html>
<html lang="en">
  <head>
    <title>{{.Title}}</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="{{.Description}}" />
    {{if .Canonical}}
    <link rel="canonical" href="{{.Canonical}}" />
    {{end}}

    <link rel="icon" href="{{asset `/favicon.ico`}}" />
    <link rel="apple-touch-icon" href="{{asset `/apple-touch-icon.png`}}" />

    <!-- Social preview. Endpoint pages are excluded from robots.txt but still
         carry these, because capture URLs are pasted into chat clients that
         unfurl them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="httphq" />
    <meta property="og:title" content="{{.Title}}" />
    <meta property="og:description" content="{{.Description}}" />
    {{if .Canonical}}
    <meta property="og:url" content="{{.Canonical}}" />
    {{end}} {{if .SocialImage}}
    <meta property="og:image" content="{{.SocialImage}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="httphq: inspect HTTP requests in real time"
    />
    <meta name="twitter:card" content="summary_large_image" />
    {{else}}
    <meta name="twitter:card" content="summary" />
    {{end}}

    <!-- Built from src/styles/app.css by `npm run css`. The only stylesheet on
         the marketing and contact pages, and the only render-blocking resource
         anywhere: no page waits on a third party to have a layout. -->
    <link rel="stylesheet" href="{{asset `/app.css`}}" />

    {{if .AppScripts}}
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />

    <!-- highlight.js (browser bundle, common languages incl. JSON + XML) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/styles/github.min.css"
      integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"
      integrity="sha384-GdEWAbCjn+ghjX0gLx7/N1hyTVmPAjdC2OvoAA0RyNcAOhqwtT8qnbCxWle2+uJX"
      crossorigin="anonymous"
    ></script>

    <!-- App scripts must register their alpine:init listeners BEFORE Alpine
         loads, because Alpine v3 schedules its first alpine:init dispatch via
         queueMicrotask at the end of its own script execution. -->
    <script defer src="{{asset `/index.js`}}"></script>
    <script defer src="{{asset `/render-body.js`}}"></script>
    <script defer src="{{asset `/har.js`}}"></script>
    <script defer src="{{asset `/endpoint.js`}}"></script>

    <!-- Alpine.js (loaded last so app scripts can subscribe first). -->
    <script
      defer
      src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"
      integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh"
      crossorigin="anonymous"
    ></script>
    {{end}}
  </head>
  <body
    class="bg-neutral-50 text-neutral-800 antialiased min-h-screen flex flex-col"
  >
    <div class="mx-auto w-full max-w-5xl px-4 sm:px-6 flex-1 flex flex-col">
      {{embed}}
    </div>
  </body>
</html>
