<!-- The open/closed affordance for a `.panel-summary`. It replaces the native
     marker, so it rotates with the parent `details` rather than carrying a
     state of its own. Quieter than the label it follows: it reports state, it
     is not the thing being read. -->
<svg
  viewBox="0 0 24 24"
  class="icon text-neutral-400 transition group-open:rotate-180"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  aria-hidden="true"
>
  <polyline points="6 9 12 15 18 9" />
</svg>
