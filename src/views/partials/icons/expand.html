<!-- Lucide ChevronDown: the open/closed affordance for a `.panel-summary`.
     It replaces the native marker and rotates with the parent `details`
     rather than swapping glyphs, so it carries no state of its own. Quieter
     than the label it follows: it reports state, it is not the thing being
     read. -->
<svg
  viewBox="0 0 24 24"
  class="icon text-neutral-400 transition group-open:rotate-180"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  <path d="m6 9 6 6 6-6" />
</svg>
