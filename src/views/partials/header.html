<!-- The link wraps only the wordmark, not the full header band. A block-level
     flex container spans the viewport, which would make every click in the
     band's whitespace a navigation. -->
<header class="py-6 sm:py-8 text-center">
  <a
    href="/"
    class="inline-flex items-center gap-2.5 no-underline text-neutral-700 rounded-md px-2 py-1 focus-ring"
  >
    <img
      src="{{asset `/logo.svg`}}"
      alt=""
      width="24"
      height="24"
      class="w-6 h-6"
    />
    <span class="text-3xl font-bold tracking-tight">httphq</span>
  </a>
</header>
