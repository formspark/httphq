<!-- Links carry their own padding and a minimum height. Bare inline text has a
     hit area no larger than its text box, under the 24px target minimum, and
     these are the page's only exits. -->
<footer class="mt-auto pt-12 pb-8 text-center text-sm text-neutral-500">
  <div>
    <a
      href="/contact"
      class="inline-flex items-center justify-center min-h-11 px-3 rounded-md hover:text-brand-600 hover:underline focus-ring"
      >Send us feedback</a
    >
  </div>
  <div>
    <a
      href="https://github.com/formspark/httphq"
      target="_blank"
      rel="noopener"
      class="inline-flex items-center justify-center gap-1.5 min-h-11 px-3 rounded-md hover:text-brand-600 focus-ring"
    >
      {{template "partials/brands/github" .}}
      <span>formspark/httphq</span>
    </a>
  </div>
  <div class="inline-flex items-center justify-center">
    <span>Sponsored by</span>
    <a
      href="https://formspark.io/"
      class="inline-flex items-center justify-center min-h-11 px-2 rounded-md text-brand-600 hover:underline focus-ring"
      >Formspark</a
    >
  </div>
</footer>
