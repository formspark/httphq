{{template "partials/header" .}}

<main class="flex-1 py-8 sm:py-12">
  <div class="max-w-xl mx-auto">
    <div class="text-center mb-8 space-y-2">
      <h1 class="text-2xl sm:text-3xl font-semibold text-neutral-900">
        Get in touch
      </h1>
      <p class="text-neutral-600">
        Found a bug, have an idea, or want to say hi? We read every message.
      </p>
    </div>

    <form
      action="https://submit-form.com/bKTG9w9O"
      method="POST"
      class="panel p-6 sm:p-8 space-y-5"
    >
      <input
        type="checkbox"
        name="accept"
        class="hidden"
        tabindex="-1"
        autocomplete="off"
        aria-hidden="true"
      />

      <div>
        <label for="name" class="field-label">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          aria-required="true"
          autocomplete="name"
          class="field"
        />
      </div>

      <div>
        <label for="email" class="field-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          aria-required="true"
          autocomplete="email"
          placeholder="you@example.com"
          class="field"
        />
      </div>

      <div>
        <label for="message" class="field-label">Message</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          required
          aria-required="true"
          placeholder="What's on your mind?"
          class="field"
        ></textarea>
      </div>

      <div
        class="flex items-center justify-between gap-3 pt-4 border-t border-neutral-100"
      >
        <p class="text-xs text-neutral-500">
          We typically reply within a couple of days.
        </p>
        <button type="submit" data-test="send-form" class="btn btn-primary">
          Send message
        </button>
      </div>
    </form>
  </div>
</main>

{{template "partials/footer" .}}
