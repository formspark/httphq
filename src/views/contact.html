{{template "partials/header" .}}

<main class="flex-1">
  <div class="max-w-xl mx-auto py-8 sm:py-16">
    <h1 class="text-2xl font-semibold text-slate-900 mb-6">Send us feedback</h1>

    <form
      action="https://submit-form.com/bKTG9w9O"
      method="POST"
      class="space-y-4"
    >
      <input
        type="checkbox"
        name="accept"
        class="hidden"
        tabindex="-1"
        autocomplete="off"
        aria-hidden="true"
      />

      <div>
        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">
          Name
        </label>
        <input
          type="text"
          id="name"
          name="name"
          required
          aria-required="true"
          class="block w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">
          Email
        </label>
        <input
          type="email"
          id="email"
          name="email"
          required
          aria-required="true"
          class="block w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        />
      </div>

      <div>
        <label for="message" class="block text-sm font-medium text-slate-700 mb-1">
          Message
        </label>
        <textarea
          id="message"
          name="message"
          rows="6"
          required
          aria-required="true"
          class="block w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
        ></textarea>
      </div>

      <div>
        <button
          type="submit"
          data-test="send-form"
          class="inline-flex items-center justify-center rounded-md bg-indigo-600 px-5 py-2.5 text-white font-medium shadow-sm hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-500 transition"
        >
          Send message
        </button>
      </div>
    </form>
  </div>
</main>

{{template "partials/footer" .}}
