{{template "partials/header" .}}

<main
  class="flex-1 pb-12"
  x-data="endpointPage"
  data-endpoint-id="{{.EndpointID}}"
>
  <!-- Endpoint URL panel -->
  <section class="mt-2 mb-6">
    <div
      class="rounded-lg border border-slate-200 bg-white shadow-sm p-4 sm:p-5 space-y-3"
    >
      <div class="text-sm font-medium text-slate-500 uppercase tracking-wide">
        Your unique URL
      </div>
      <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
        <code
          data-test="endpoint-url"
          x-ref="endpointUrl"
          class="flex-1 select-all break-all rounded bg-slate-50 border border-slate-200 px-3 py-2 text-sm font-mono text-indigo-700"
          >{{.EndpointURL}}</code
        >
        <button
          type="button"
          data-test="copy-url"
          @click="copy($refs.endpointUrl.textContent)"
          class="inline-flex shrink-0 items-center justify-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
        >
          <svg
            viewBox="0 0 24 24"
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <rect x="9" y="9" width="13" height="13" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
          <span x-text="copyLabel" data-test="copy-url-label">Copy</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Send custom request panel -->
  <section class="mb-6">
    <details
      class="group rounded-lg border border-slate-200 bg-white shadow-sm"
    >
      <summary
        data-test="send-toggle"
        class="list-none px-4 sm:px-5 py-3 flex items-center gap-2 font-medium text-slate-700 hover:bg-slate-50"
      >
        <svg
          viewBox="0 0 24 24"
          class="w-4 h-4 shrink-0"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M22 2L11 13" />
          <path d="M22 2l-7 20-4-9-9-4 20-7z" />
        </svg>
        <span>Send a test request</span>
        <svg
          viewBox="0 0 24 24"
          class="w-4 h-4 text-slate-400 transition group-open:rotate-180"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </summary>

      <form
        @submit.prevent="sendCustom()"
        class="border-t border-slate-200 p-4 sm:p-5 space-y-3"
      >
        <label class="block sm:max-w-[10rem]">
          <span
            class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1"
            >Method</span
          >
          <select
            data-test="send-method"
            x-model="sendForm.method"
            class="app-select block w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400 focus:border-indigo-500"
          >
            <template x-for="m in METHODS" :key="m">
              <option :value="m" x-text="m"></option>
            </template>
          </select>
        </label>
        <label class="block">
          <span
            class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1"
          >
            Headers (one per line, <code class="font-mono">Key: Value</code>)
          </span>
          <textarea
            data-test="send-headers"
            x-model="sendForm.headers"
            rows="2"
            spellcheck="false"
            placeholder="Content-Type: application/json"
            class="block w-full rounded-md border border-slate-300 px-3 py-2 text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-400 focus:border-indigo-500"
          ></textarea>
        </label>
        <label class="block">
          <span
            class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1"
            >Body</span
          >
          <textarea
            data-test="send-body"
            x-model="sendForm.body"
            rows="4"
            spellcheck="false"
            placeholder='{"hello":"world"}'
            class="block w-full rounded-md border border-slate-300 px-3 py-2 text-sm font-mono focus:outline-none focus:ring-1 focus:ring-indigo-400 focus:border-indigo-500"
          ></textarea>
        </label>
        <div class="flex items-center justify-between">
          <p class="text-xs text-slate-500" x-text="sendStatus"></p>
          <button
            type="submit"
            data-test="send-submit"
            class="inline-flex items-center justify-center rounded-md bg-indigo-600 px-4 py-2 text-sm text-white font-medium shadow-sm hover:bg-indigo-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-indigo-500"
          >
            Send
          </button>
        </div>
      </form>
    </details>
  </section>

  <!-- Disclaimer + delete-all -->
  <div
    class="mb-4 flex items-center justify-between gap-4 text-sm text-slate-500"
  >
    <p class="inline-flex items-center gap-2">
      <span aria-hidden="true">⚠️</span>
      <span>Requests are deleted after 4 hours</span>
    </p>
    <div class="flex items-center gap-2">
      <button
        type="button"
        data-test="copy-all-har"
        @click="copyHar($store.main.visibleRequests, '__all__')"
        :disabled="$store.main.visibleRequests.length === 0"
        title="Copy every request shown as HAR-shaped JSON"
        class="inline-flex items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <svg
          viewBox="0 0 24 24"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <rect x="9" y="2" width="6" height="4" rx="1" />
          <path
            d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
          />
        </svg>
        <span
          data-test="copy-all-har-label"
          x-text="copiedKey === '__all__' ? 'Copied!' : `Copy all (${$store.main.visibleRequests.length})`"
        ></span>
      </button>
      <button
        type="button"
        data-test="delete-requests"
        @click="$store.main.deleteRequests()"
        class="inline-flex items-center gap-1.5 rounded-md border border-rose-200 bg-rose-50 px-3 py-1.5 text-sm font-medium text-rose-700 hover:bg-rose-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-500"
      >
        <svg
          viewBox="0 0 24 24"
          class="w-4 h-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6" />
          <path d="M14 11v6" />
        </svg>
        Delete all
      </button>
    </div>
  </div>

  <!-- Filter bar -->
  <div
    class="sticky top-0 z-10 -mx-4 sm:-mx-6 px-4 sm:px-6 py-3 bg-slate-50/95 backdrop-blur border-y border-slate-200 mb-4 flex flex-col sm:flex-row gap-3 sm:items-center"
  >
    <select
      data-test="method-filter"
      x-model="$store.main.methodFilter"
      class="app-select rounded-md border border-slate-300 bg-white px-3 py-2 text-sm sm:w-40 focus:outline-none focus:ring-1 focus:ring-indigo-400 focus:border-indigo-500"
    >
      <option value="">Any method</option>
      <template x-for="m in METHODS" :key="m">
        <option :value="m" x-text="m"></option>
      </template>
    </select>
    <input
      data-test="search-input"
      type="search"
      x-model.debounce="$store.main.search"
      placeholder="Search headers, query string, and body..."
      class="flex-1 rounded-md border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400 focus:border-indigo-500"
    />
    <span
      data-test="search-results"
      class="text-sm text-slate-500 sm:text-right shrink-0"
      x-text="`${$store.main.visibleRequests.length} ${$store.main.visibleRequests.length === 1 ? 'result' : 'results'}`"
    ></span>
  </div>

  <!-- Requests list -->
  <section data-test="requests" class="space-y-4">
    <!-- Empty state -->
    <template x-if="$store.main.visibleRequests.length === 0">
      <div
        class="rounded-lg border border-dashed border-slate-300 bg-white py-12 px-4 text-center text-slate-500"
      >
        <p class="text-base">
          Waiting for requests<span
            class="loading-dots"
            aria-hidden="true"
          ></span>
        </p>
        <p class="mt-2 text-sm">
          Requests sent to your URL will appear here in real time.
        </p>
      </div>
    </template>

    <!-- Cards -->
    <template
      x-for="request in $store.main.visibleRequests"
      :key="request.uuid"
    >
      <article
        :id="`request-${request.uuid}`"
        data-test="request"
        class="rounded-lg border border-slate-200 bg-white shadow-sm overflow-hidden"
      >
        <header
          class="flex items-center justify-between gap-3 px-4 sm:px-5 py-3 border-b border-slate-200"
        >
          <div class="flex items-center gap-3 min-w-0">
            <span
              data-test="request-method"
              x-text="request.method"
              :class="methodBadge(request.method)"
              class="inline-flex items-center justify-center rounded px-2 py-0.5 text-xs font-semibold uppercase tracking-wide shrink-0"
            ></span>
            <a
              data-test="request-uuid"
              :href="`#request-${request.uuid}`"
              x-text="request.uuid"
              class="text-xs text-slate-500 font-mono truncate hover:text-indigo-600"
            ></a>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <button
              type="button"
              data-test="copy-request-har"
              @click="copyHar([request], request.uuid)"
              aria-label="Copy this request as JSON"
              title="Copy the full request (method, URL, headers, query string, body) as HAR-shaped JSON"
              class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-indigo-600"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <rect x="9" y="2" width="6" height="4" rx="1" />
                <path
                  d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"
                />
              </svg>
              <span
                data-test="copy-request-har-label"
                class="hidden sm:inline"
                x-text="copiedKey === request.uuid ? 'Copied!' : 'Copy request'"
              ></span>
            </button>
            <button
              type="button"
              data-test="delete-request"
              @click="$store.main.deleteRequest(request.uuid)"
              class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-rose-600"
              aria-label="Delete this request"
            >
              <svg
                viewBox="0 0 24 24"
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
              <span class="hidden sm:inline">Delete</span>
            </button>
          </div>
        </header>

        <div class="space-y-4 p-4 sm:p-5">
          <!-- Details -->
          <div data-test="request-details">
            <div
              class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2"
            >
              Details
            </div>
            <dl
              class="grid grid-cols-[10rem_1fr] gap-x-3 text-sm divide-y divide-slate-100 [&>dt]:py-1.5 [&>dd]:py-1.5"
            >
              <dt class="text-slate-500">Time</dt>
              <dd
                :title="request.createdAt.toLocaleString()"
                x-text="formatTimeAgo(request.createdAt)"
              ></dd>
              <dt class="text-slate-500">Client IP</dt>
              <dd class="font-mono text-xs" x-text="request.ip || '—'"></dd>
              <dt class="text-slate-500">Path</dt>
              <dd
                class="font-mono text-xs break-all"
                x-text="request.path"
              ></dd>
            </dl>
          </div>

          <!-- Headers -->
          <div data-test="request-headers">
            <div class="flex items-center justify-between mb-2">
              <div
                class="text-xs font-medium text-slate-500 uppercase tracking-wide"
              >
                Headers
              </div>
              <button
                type="button"
                data-test="copy-headers"
                @click="copy(JSON.stringify(request.headers, null, 2))"
                class="text-xs text-slate-500 hover:text-indigo-600"
              >
                Copy
              </button>
            </div>
            <div class="overflow-auto max-h-64">
              <dl class="grid grid-cols-[10rem_1fr] gap-x-3 text-xs">
                <template
                  x-for="[k, v] in Object.entries(request.headers)"
                  :key="k"
                >
                  <div class="contents">
                    <dt
                      class="py-1 text-slate-500 font-mono break-all border-t border-slate-100 first:border-t-0"
                      x-text="k"
                    ></dt>
                    <dd
                      class="py-1 font-mono break-all border-t border-slate-100 first:border-t-0"
                      x-text="Array.isArray(v) ? v.join(', ') : v"
                    ></dd>
                  </div>
                </template>
              </dl>
            </div>
          </div>
        </div>

        <!-- Query string -->
        <div data-test="query-string" class="px-4 sm:px-5 pb-3">
          <div
            class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-1"
          >
            Query string
          </div>
          <template x-if="request.queryString">
            <pre
              class="text-xs font-mono bg-slate-50 border border-slate-200 rounded p-3 overflow-auto"
              x-text="request.queryString"
            ></pre>
          </template>
          <template x-if="!request.queryString">
            <p class="text-xs text-slate-400 italic">None</p>
          </template>
        </div>

        <!-- Body -->
        <div data-test="request-body" class="px-4 sm:px-5 pb-4 sm:pb-5">
          <div class="flex items-center justify-between mb-1">
            <div
              class="text-xs font-medium text-slate-500 uppercase tracking-wide"
            >
              Body
            </div>
            <button
              type="button"
              data-test="copy-body"
              x-show="request.body"
              @click="copy(request.body)"
              class="text-xs text-slate-500 hover:text-indigo-600"
            >
              Copy
            </button>
          </div>
          <template x-if="request.body">
            <pre
              class="text-xs font-mono bg-slate-50 border border-slate-200 rounded p-3 overflow-auto max-h-96"
              x-html="renderBody(request.body, request.headers)"
            ></pre>
          </template>
          <template x-if="!request.body">
            <p class="text-xs text-slate-400 italic">None</p>
          </template>
        </div>
      </article>
    </template>
  </section>
</main>

{{template "partials/footer" .}}
